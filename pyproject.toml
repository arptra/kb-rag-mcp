[project]
name = "corporate-kb"
version = "0.1.0"
description = "Local in-memory corporate RAG exposed to Qwen Code through MCP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "markdownify>=1.2,<2",
    "mcp[cli]>=2,<3",
    "numpy>=2.2,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-frontmatter>=1.1,<2",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=5.0,<6",
]

[project.scripts]
kb = "corporate_kb.cli:main"
kb-mcp = "corporate_kb.mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corporate_kb"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["corporate_kb"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["frontmatter", "markdownify", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
