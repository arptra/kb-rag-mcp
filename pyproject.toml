[project]
name = "corporate-kb"
version = "0.1.0"
description = "Local in-memory corporate RAG exposed to GigaCode through MCP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "markdown-it-py>=4,<5",
    "markdownify>=1.2,<2",
    "fastmcp==3.4.4",
    "cryptography>=45,<50",
    "pyOpenSSL>=25.3,<27",
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "uvicorn>=0.51,<0.52",
    "numpy>=2.2,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-frontmatter>=1.1,<2",
    "pyyaml>=6,<7",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-kotlin>=1.1,<2",
    "typer>=0.16,<1",
    "langchain>=1.5,<2",
    "langchain-text-splitters>=1,<2",
    "langgraph>=1.2.22,<2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=5.0,<6",
]
agents = [
    "filelock>=3,<4",
    "deepagents>=0.7.39,<1",
    "langchain-openai>=1,<2",
    "jsonschema>=4.25,<5",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
]

[project.scripts]
kb = "corporate_kb.cli:main"
kb-mcp = "corporate_kb.mcp.server:main"
kb-mcp-http = "corporate_kb.mcp.http_server:main"
kb-access = "corporate_kb.access.client:main"
kb-dev-console = "dev_console.__main__:main"
gigacode-graph = "gigacode_graph.cli:main"
gigacode-graph-mcp = "gigacode_graph.mcp_server:main"
gigacode-graph-http = "gigacode_graph.http_server:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corporate_kb", "src/gigacode_graph", "src/service_map", "src/skill_registry", "src/dev_console", "src/portal_agents"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["corporate_kb", "gigacode_graph", "service_map", "skill_registry", "dev_console"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "frontmatter",
    "jsonschema",
    "jsonschema.*",
    "markdownify",
    "sentence_transformers",
    "sentence_transformers.*",
    "tree_sitter_kotlin",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
