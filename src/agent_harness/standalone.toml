[project]
name = "agent-harness"
version = "0.1.0"
description = "Detachable question and investigation workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "starlette>=0.52,<2",
    "uvicorn>=0.51,<0.52",
    "httpx>=0.28,<1",
    "mcp>=1.29,<2",
    "jsonschema>=4.25,<5",
]

[project.scripts]
agent-harness = "agent_harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_harness"]
